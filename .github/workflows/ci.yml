name: CI
on:
  push:
    branches: [develop, master, feature/f0-foundation]
  pull_request:
    branches: [develop, master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify revisions
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/ci/check.py classify
      - name: Helper regression and documentation checks
        run: |
          python3 -m unittest discover -s tools/ci -v
          python3 tools/ci/check.py validate
          git show --format= --check HEAD
  verify:
    needs: checks
    if: needs.checks.outputs.mode != 'docs' && needs.checks.outputs.mode != 'covered'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.ci-cache/nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Runtime and real database preflight
        run: |
          dotnet --version
          node --version
          test "$(npm --version)" = '11.19.1'
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          command -v script
          containers=$(podman ps -aq)
          volumes=$(podman volume ls -q)
          test -z "$containers"
          test -z "$volumes"
          timeout 180 podman pull docker.io/library/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
      - name: Locked restore and single backend build
        run: |
          dotnet restore Keemese.slnx --locked-mode
          dotnet restore backend/Keemese.Database.Tests/Keemese.Database.Tests.csproj --locked-mode
          dotnet build Keemese.slnx --no-restore -m:1
          dotnet build backend/Keemese.Database.Tests/Keemese.Database.Tests.csproj --no-restore -m:1
      - name: API and original database regressions
        if: needs.checks.outputs.mode != 'frontend'
        run: |
          timeout 240 dotnet test Keemese.slnx --no-build --filter 'FullyQualifiedName!~UiTestHost'
          timeout 120 dotnet test backend/Keemese.Database.Tests/Keemese.Database.Tests.csproj --no-build
      - name: Locked frontend restore, strict tests and production build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --types node --skipLibCheck e2e/*.ts playwright.config.ts
          npm run build
          PLAYWRIGHT_BROWSERS_PATH="$PWD/node_modules/.cache/ms-playwright" npx playwright install --with-deps chromium
      - name: Built-asset Chromium API and real database journeys
        working-directory: frontend
        run: timeout 300 npm run test:e2e
      - name: Independently verify resource teardown
        if: always()
        run: |
          containers=$(podman ps -aq)
          volumes=$(podman volume ls -q)
          test -z "$containers"
          test -z "$volumes"
          test -z "$(find frontend/node_modules/.cache -maxdepth 1 -name 'ui-host-*.done' -print 2>/dev/null)"
      - name: Bounded failure report
        if: failure()
        env:
          MODE: ${{ needs.checks.outputs.mode }}
        run: |
          mkdir -p .ci-report
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.dumps({'mode': os.environ['MODE'], 'result': 'failed', 'details': 'See individual job steps; no raw test data retained.'})
          assert len(report.encode()) <= 1024
          Path('.ci-report/result.json').write_text(report)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        if: failure()
        with:
          name: ci-failure-summary
          path: .ci-report/result.json
          retention-days: 3
          if-no-files-found: error
  result:
    needs: [checks, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful prerequisites
        env:
          LIGHT_RESULT: ${{ needs.checks.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MODE: ${{ needs.checks.outputs.mode }}
        run: |
          test "$LIGHT_RESULT" = success
          if [ "$MODE" = docs ] || [ "$MODE" = covered ]; then
            test "$VERIFY_RESULT" = skipped
          else
            test "$VERIFY_RESULT" = success
          fi
